spring.application.name=price-monitor-api
spring.config.import=optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/price_monitor}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
monitor.interval-ms=${MONITOR_INTERVAL_MS:1800000}
monitor.request-timeout-ms=${MONITOR_REQUEST_TIMEOUT_MS:20000}
monitor.allowed-origins=${MONITOR_ALLOWED_ORIGINS:http://localhost:5173}
monitor.push.public-key=${VAPID_PUBLIC_KEY:}
monitor.push.private-key=${VAPID_PRIVATE_KEY:}
monitor.push.subject=${VAPID_SUBJECT:mailto:admin@example.com}
